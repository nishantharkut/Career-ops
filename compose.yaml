services:
  storage-init:
    build:
      context: .
    command:
      - python
      - -m
      - careerops.operations.storage_init
      - --uid
      - "${CAREEROPS_UID:-1000}"
      - --gid
      - "${CAREEROPS_GID:-1000}"
      - /app/data
      - /app/vault
      - /app/backups
    restart: "no"
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./vault
        target: /app/vault
      - type: bind
        source: ./backups
        target: /app/backups

  careerops:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    user: "${CAREEROPS_UID:-1000}:${CAREEROPS_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CAREEROPS_PORT:-8765}:8765"
    environment:
      CAREEROPS_DB_PATH: /app/data/careerops.db
      CAREEROPS_VAULT_PATH: /app/vault
      CAREEROPS_BACKUP_PATH: /app/backups
      CAREEROPS_REQUIRE_AUTH: "true"
      CAREEROPS_AUTH_USERNAME: ${CAREEROPS_AUTH_USERNAME:?set CAREEROPS_AUTH_USERNAME}
      CAREEROPS_AUTH_PASSWORD: ${CAREEROPS_AUTH_PASSWORD:?set CAREEROPS_AUTH_PASSWORD}
      CAREEROPS_ALLOWED_ORIGINS: ${CAREEROPS_ALLOWED_ORIGINS:-}
      CAREEROPS_CODEX_ENABLED: "${CAREEROPS_CODEX_ENABLED:-false}"
      CAREEROPS_CODEX_COMMANDS: ${CAREEROPS_CODEX_COMMANDS:-codex2,codex}
      CAREEROPS_OLLAMA_URL: http://ollama:11434
      CAREEROPS_OLLAMA_MODEL: ${CAREEROPS_OLLAMA_MODEL:-qwen2.5:7b}
      CAREEROPS_OLLAMA_MANAGED_MODE: container
      HOME: /tmp/careerops
      XDG_CACHE_HOME: /tmp/careerops/cache
      NO_PROXY: ollama,127.0.0.1,localhost
      no_proxy: ollama,127.0.0.1,localhost
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./vault
        target: /app/vault
      - type: bind
        source: ./backups
        target: /app/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    networks:
      - public_api
      - ollama_private
      - attestation_private
    depends_on:
      storage-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
        restart: true
      runtime-inspector:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  runtime-inspector:
    build:
      context: .
    command:
      - python
      - -m
      - careerops.operations.container_runtime_inspector
    restart: unless-stopped
    user: "${CAREEROPS_UID:-1000}:${CAREEROPS_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - attestation_private
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POST: "0"
      CONTAINERS: "1"
      NETWORKS: "1"
      VERSION: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - attestation_private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:2375/version >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama-bootstrap:
    image: ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        ollama serve >/tmp/ollama-bootstrap.log 2>&1 &
        pid=$$!
        trap 'kill "$$pid" >/dev/null 2>&1 || true' EXIT
        attempts=0
        until ollama list >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 120 ]; then exit 11; fi
          sleep 1
        done
        if ! ollama show "$$CAREEROPS_OLLAMA_MODEL" >/dev/null 2>&1; then
          ollama pull "$$CAREEROPS_OLLAMA_MODEL"
        fi
        ollama show "$$CAREEROPS_OLLAMA_MODEL" >/dev/null 2>&1
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODELS: /root/.ollama/models
      CAREEROPS_OLLAMA_MODEL: ${CAREEROPS_OLLAMA_MODEL:-qwen2.5:7b}
      HOME: /root
    volumes:
      - type: volume
        source: ollama_models
        target: /root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    networks:
      - model_bootstrap_egress

  ollama:
    image: ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODELS: /root/.ollama/models
      CAREEROPS_OLLAMA_MODEL: ${CAREEROPS_OLLAMA_MODEL:-qwen2.5:7b}
      HOME: /root
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    expose:
      - "11434"
    volumes:
      - type: volume
        source: ollama_models
        target: /root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    networks:
      - ollama_private
    depends_on:
      ollama-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list >/dev/null 2>&1 || exit 1; ollama show \"$${CAREEROPS_OLLAMA_MODEL}\" >/dev/null 2>&1 || exit 2"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  public_api:
    driver: bridge
  ollama_private:
    driver: bridge
    internal: true
  attestation_private:
    driver: bridge
    internal: true
  model_bootstrap_egress:
    driver: bridge

volumes:
  ollama_models:
